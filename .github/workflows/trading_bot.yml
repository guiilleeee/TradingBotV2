name: TradingBot cycle

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot-cycle
  cancel-in-progress: false

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run trading cycle
        # Every secret the bot actually reads must be listed here. An earlier
        # version left GEMINI_API_KEY out of this block (it existed only in a
        # separate test workflow) and every cycle failed on every symbol for days
        # without surfacing anywhere except the CSV.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required alongside the key: an identity-linked API key is rejected
          # without the anthropic-workspace-id header it supplies.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          HYPERLIQUID_WALLET_ADDRESS: ${{ secrets.HYPERLIQUID_WALLET_ADDRESS }}
          HYPERLIQUID_PRIVATE_KEY: ${{ secrets.HYPERLIQUID_PRIVATE_KEY }}
          # Optional: alerts are a no-op with either of these unset (telegram_alerts.py).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --config config.yaml

      - name: Publish dashboard
        run: |
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp signals.csv docs/signals.csv
          cp config.yaml docs/config.yaml

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html docs/signals.csv docs/config.yaml signals.csv trading_bot.db
          if git diff --staged --quiet; then
            echo "Nothing changed this cycle."
          else
            git commit -m "chore: trading cycle results [skip ci]"
            git push
          fi
