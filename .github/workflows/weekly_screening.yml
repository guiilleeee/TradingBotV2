name: Weekly symbol screening

on:
  schedule:
    # Monday 06:00 UTC. Independent of trading_bot.yml's cron entirely -- no
    # workflow_run chaining, no shared job, no shared secrets beyond what each
    # actually needs. A failure here cannot block or break the 4h cycle because
    # there is nothing in either file that makes one depend on the other.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-symbol-screening
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run weekly screening
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Optional: alerts are a no-op with either of these unset (telegram_alerts.py).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screening.py --output symbols.yaml

      - name: Commit symbols.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symbols.yaml
          if git diff --staged --quiet; then
            echo "No change to symbols.yaml this run (screening left it untouched, or it is unchanged)."
          else
            git commit -m "chore: weekly symbol screening [skip ci]"
            git push
          fi
