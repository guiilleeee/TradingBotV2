<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingBot v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --panel: #12171f;
    --panel-2: #171d28;
    --border: rgba(255,255,255,.08);
    --border-strong: rgba(255,255,255,.16);
    --text: #e8edf4;
    --text-dim: #aab4c2;
    --muted: #7c8798;
    --buy: #3ddc84;
    --sell: #ff5c72;
    --hold: #7c8798;
    --auto: #f0b429;
    --breaker: #ff8a3d;
    --override: #c893ff;
    --accent: #5b9dff;
    --sim: #3ddc84;
    --live: #ff5c72;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --space-12: 48px;

    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;

    --elevation-1: 0 1px 2px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.025);
    --elevation-2: 0 8px 24px -6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.035);
    --elevation-3: 0 20px 48px -10px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.045);

    --ease: cubic-bezier(.2,.8,.2,1);
    --dur-fast: 170ms;
    --dur-med: 520ms;

    --font-ui: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* Respect prefers-reduced-motion globally -- transitions and CSS animations
     collapse to effectively instant; JS-driven number tweening checks the same
     media query itself (see REDUCE_MOTION below) and skips straight to the target
     value instead of running its own rAF loop. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font: 14px/1.55 var(--font-ui);
    margin: 0; padding: var(--space-6) var(--space-6) var(--space-12); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- themed scrollbar ---- */
  * { scrollbar-width: thin; scrollbar-color: #2c3444 var(--panel); }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: var(--panel); }
  *::-webkit-scrollbar-thumb { background: #2c3444; border-radius: 6px; border: 2px solid var(--panel); }
  *::-webkit-scrollbar-thumb:hover { background: #3a445a; }

  .icon { width: 1em; height: 1em; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }
  .icon-fill { fill: currentColor; stroke: none; }

  /* ---------------------------------------------------------------- header */
  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-3) var(--space-6);
    margin-bottom: var(--space-6);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; }

  .mode-badge {
    display: inline-flex; align-items: center; font-size: 11px; font-weight: 700;
    letter-spacing: .5px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .mode-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; margin-right: 6px; }
  .mode-badge.live { background: rgba(255,92,114,.14); color: var(--live); box-shadow: inset 0 0 0 1px rgba(255,92,114,.3); }
  .mode-badge.sim { background: rgba(61,220,132,.14); color: var(--sim); box-shadow: inset 0 0 0 1px rgba(61,220,132,.3); }

  .clocks { display: flex; gap: var(--space-2); margin-left: auto; flex-wrap: wrap; }
  .clock {
    display: flex; align-items: center; gap: 7px; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 11px;
    font-size: 12px; box-shadow: var(--elevation-1);
  }
  .clock .icon { color: var(--muted); }
  .clock .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .clock .dot.open { background: var(--buy); box-shadow: 0 0 6px var(--buy); }
  .clock .dot.closed { background: var(--muted); }
  .clock b { font-weight: 600; }
  .clock span.label { color: var(--muted); }

  /* -------------------------------------------------------------- countdown */
  @property --pct {
    syntax: '<number>'; inherits: true; initial-value: 0;
  }
  .countdown {
    display: flex; align-items: center; gap: var(--space-3); background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius-md); padding: 7px 15px 7px 7px;
    box-shadow: var(--elevation-1);
  }
  .countdown .ring {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    background: conic-gradient(var(--accent) calc(var(--pct, 0) * 1%), #232c3a 0);
    display: flex; align-items: center; justify-content: center;
    transition: --pct 900ms linear;
  }
  .countdown .ring::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--panel); }
  .countdown .text { display: flex; flex-direction: column; line-height: 1.25; }
  .countdown .text b { font-size: 14px; font-weight: 600; }
  .countdown .text span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }

  /* -------------------------------------------------------------------tabs */
  nav.tabs { position: relative; display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); margin-bottom: var(--space-6); }
  nav.tabs button {
    background: none; border: none; color: var(--muted); font: inherit; font-weight: 600;
    padding: var(--space-2) var(--space-4); cursor: pointer; font-size: 13px;
    transition: color var(--dur-fast) var(--ease);
  }
  nav.tabs button:hover { color: var(--text-dim); }
  nav.tabs button.active { color: var(--text); }
  .tab-indicator {
    position: absolute; bottom: -1px; height: 2px; left: 0; width: 0; background: var(--accent);
    border-radius: 2px 2px 0 0;
    transition: left var(--dur-fast) var(--ease), width var(--dur-fast) var(--ease);
  }
  .tab { display: none; }
  .tab.active { display: block; animation: tabIn var(--dur-fast) var(--ease); }
  @keyframes tabIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ------------------------------------------------------------- hero stat */
  .hero { margin-bottom: var(--space-8); }
  .hero-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; margin-bottom: var(--space-1); }
  .hero-value { font-size: clamp(38px, 5.2vw, 54px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .secondary-stats { display: flex; gap: var(--space-8); margin-top: var(--space-4); flex-wrap: wrap; }
  .stat b { display: block; font-size: 19px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; }
  .pos { color: var(--buy); } .neg { color: var(--sell); }

  /* ------------------------------------------------------------- panels -- */
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-4) var(--space-6); margin-bottom: var(--space-6);
    box-shadow: var(--elevation-2); position: relative;
  }
  .panel h2 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    margin: 0 0 var(--space-4); display: flex; align-items: center; gap: 6px;
  }
  #equityCurveWrap { position: relative; }
  #equityCurve { width: 100%; height: 160px; display: block; overflow: visible; cursor: crosshair; }
  .eq-line { transition: stroke var(--dur-fast) var(--ease); }
  .eq-tooltip {
    position: absolute; top: 0; pointer-events: none; transform: translate(-50%, -100%);
    background: #1a212d; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 6px 10px; font-size: 11.5px; white-space: nowrap; box-shadow: var(--elevation-2);
    display: none; z-index: 5;
  }
  .eq-tooltip b { display: block; font-size: 13px; }
  .eq-tooltip span { color: var(--muted); font-size: 10.5px; }

  /* ------------------------------------------------------------- holdings */
  .holding {
    display: grid; grid-template-columns: 1.3fr 1fr 2fr; gap: var(--space-4); align-items: center;
    background: var(--panel-2); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-2); border-left: 3px solid var(--hold);
    box-shadow: var(--elevation-1);
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .holding:hover { transform: translateY(-1px); box-shadow: var(--elevation-2); }
  .holding.pos { border-left-color: var(--buy); }
  .holding.neg { border-left-color: var(--sell); }
  .holding .head { display: flex; align-items: baseline; gap: var(--space-2); }
  .holding .head .sym { font-weight: 700; font-size: 15px; }
  .holding .head .ac { font-size: 9.5px; color: var(--muted); text-transform: uppercase; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  .holding .value { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .holding .value b { color: var(--text); font-weight: 600; }
  .holding .pnl { font-size: 11.5px; display: flex; align-items: center; gap: 10px; }
  .holding .pnl-figures b { font-size: 17px; display: block; }
  .holding .pnl-label { display: block; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
  .spark { width: 56px; height: 22px; flex: none; }
  .returns { display: flex; gap: var(--space-3); flex-wrap: wrap; align-content: center; }
  .returns .r { text-align: center; min-width: 42px; }
  .returns .r span { display: block; font-size: 9px; color: var(--muted); text-transform: uppercase; }
  .returns .r b { font-size: 12px; }
  .returns .r b.nr { color: var(--muted); font-weight: 400; }
  .empty-note { color: var(--muted); font-style: italic; padding: var(--space-3) 2px; }

  /* -------------------------------------------------------- signals table */
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 820px; }
  th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
  tbody tr { transition: background var(--dur-fast) var(--ease); }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  .action-cell { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .action-cell.buy { color: var(--buy); } .action-cell.sell { color: var(--sell); } .action-cell.hold { color: var(--hold); font-weight: 500; }
  .conf-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .conf-dot.high { background: var(--accent); } .conf-dot.mid { background: var(--auto); } .conf-dot.low { background: var(--muted); }
  td.reason { max-width: 480px; font-size: 12.5px; white-space: pre-wrap; }
  td.reason .override-note {
    display: inline-flex; align-items: flex-start; gap: 6px; font-size: 11.5px; font-style: normal;
    padding: 3px 8px; border-radius: var(--radius-sm); margin-bottom: 6px; background: rgba(255,255,255,.04);
  }
  td.reason .override-note .icon { margin-top: 2px; }
  td.reason .override-note.auto { color: var(--auto); }
  td.reason .override-note.breaker { color: var(--breaker); }
  td.reason .override-note.override { color: var(--override); }
  td.reason .headlines { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  td.reason .headlines .sub-label, td.reason .positioning .sub-label {
    display: flex; align-items: center; gap: 5px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .4px; margin-bottom: 3px;
  }
  td.reason .headlines ul { margin: 0; padding-left: 18px; }
  td.reason .headlines li { margin-bottom: 2px; }
  td.reason .positioning { margin-top: 8px; font-size: 11.5px; color: var(--accent); }
  .mode-chip { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; }
  .mode-chip.REAL { background: rgba(255,92,114,.14); color: var(--live); }
  .mode-chip.SIMULACIO { background: rgba(61,220,132,.14); color: var(--sim); }

  /* -------------------------------------------------------------- glossary */
  .gloss-search-wrap { margin-bottom: var(--space-6); }
  .gloss-search {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 13px; padding: 10px 14px; border-radius: var(--radius-md);
    outline: none; transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .gloss-search::placeholder { color: var(--muted); }
  .gloss-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,157,255,.15); }

  .gloss-category { margin-bottom: var(--space-6); }
  .gloss-category:last-child { margin-bottom: 0; }
  .gloss-cat-header {
    display: flex; align-items: center; gap: 8px; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); margin: 0 0 var(--space-3); font-weight: 700;
  }
  .gloss-cat-header .icon { color: var(--accent); }
  .gloss-terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--space-3); }
  .gloss-card {
    background: var(--panel-2); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
    box-shadow: var(--elevation-1);
    transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .gloss-card:hover { transform: translateY(-1px); box-shadow: var(--elevation-2); }
  .gloss-term-heading { font-weight: 600; color: var(--accent); font-size: 13px; letter-spacing: .1px; }
  .gloss-def { margin: 6px 0 0; color: var(--text-dim); font-size: 12.5px; line-height: 1.5; }
  .gloss-empty { color: var(--muted); font-style: italic; padding: var(--space-3) 2px; }

  /* --------------------------------------------------- inline term popover */
  .term { border-bottom: 1px dotted var(--muted); cursor: help; }
  #termPopover {
    position: fixed; max-width: 280px; background: #1a212d; border: 1px solid var(--border-strong);
    border-radius: var(--radius-md); padding: var(--space-3); font-size: 12.5px;
    box-shadow: var(--elevation-3); z-index: 50; display: none; transform-origin: top left;
  }
  #termPopover.visible { display: block; animation: popIn var(--dur-fast) var(--ease); }
  @keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(-2px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  #termPopover b { display: block; color: var(--accent); margin-bottom: 4px; text-transform: capitalize; }

  footer { margin-top: var(--space-8); color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<!-- Icon sprite: one small, consistent stroke-based icon language for the whole
     page instead of emoji (which render inconsistently across platforms/fonts). -->
<svg style="position:absolute; width:0; height:0" aria-hidden="true">
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.3 2"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-9"/><path d="M14 6h6v6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M4 7l6 6 4-4 6 9"/><path d="M14 18h6v-6"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 5-3.4 8.4-7 9-3.6-.6-7-4-7-9V6l7-3z"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="1.5"/><path d="M17 9h4v9a2 2 0 0 1-2 2H7"/><line x1="6" y1="9" x2="12" y2="9"/><line x1="6" y1="12.5" x2="14" y2="12.5"/><line x1="6" y1="16" x2="11" y2="16"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></symbol>
</svg>

<header>
  <h1>TradingBot v2 <span>&mdash; Fase 3</span></h1>
  <span id="modeBadge" class="mode-badge sim"><span class="dot"></span>&mdash;</span>
  <div id="countdown" class="countdown">
    <div class="ring" style="--pct:0"></div>
    <div class="text"><b id="countdownTime" class="mono">&mdash;</b><span>Proxima analisi</span></div>
  </div>
  <div id="clocks" class="clocks"></div>
</header>

<nav class="tabs" id="tabsNav">
  <button data-tab="resum" class="active">Resum</button>
  <button data-tab="analisi">Analisi</button>
  <button data-tab="significats">Significats</button>
  <span class="tab-indicator" id="tabIndicator"></span>
</nav>

<!-- ================================================================ Resum -->
<section id="tab-resum" class="tab active">
  <div class="hero">
    <div class="hero-label"><span class="term" data-term="patrimoni total">Patrimoni total</span></div>
    <div class="hero-value mono" id="equity">&mdash;</div>
    <div class="secondary-stats">
      <div class="stat"><b class="mono" id="count">&mdash;</b><span>Senyals</span></div>
      <div class="stat"><b class="mono" id="pnl">&mdash;</b><span><span class="term" data-term="p&amp;l realitzat">P&amp;L realitzat</span></span></div>
    </div>
  </div>

  <div class="panel" id="equityCurveWrap">
    <h2><svg class="icon"><use href="#i-up"/></svg>Corba de patrimoni</h2>
    <svg id="equityCurve" viewBox="0 0 680 160" preserveAspectRatio="none"></svg>
    <div class="eq-tooltip" id="eqTooltip"></div>
  </div>

  <div class="panel">
    <h2><svg class="icon"><use href="#i-wallet"/></svg>Posicions obertes</h2>
    <div id="holdings"></div>
  </div>
</section>

<!-- =============================================================== Analisi -->
<section id="tab-analisi" class="tab">
  <div class="panel">
    <div class="wrap"><table>
      <thead><tr>
        <th>Data</th><th>Simbol</th><th>Mode</th><th>Accio</th><th>Model</th><th><span class="term" data-term="confidence">Conf.</span></th>
        <th>Mida %</th><th>Preu</th><th>Exec.</th><th>P&amp;L</th><th>Analisi completa</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</section>

<!-- =========================================================== Significats -->
<section id="tab-significats" class="tab">
  <div class="panel">
    <div class="gloss-search-wrap">
      <input type="search" id="glossarySearch" class="gloss-search mono"
             placeholder="Cerca un terme (stop-loss, RSI, confidence...)" autocomplete="off">
    </div>
    <div id="glossaryList"></div>
  </div>
</section>

<div id="termPopover"></div>

<footer>Dades generades pel pipeline TradingBot. Actualitzacio automatica cada <span id="refreshSecs">45</span>s.</footer>

<script>
// Respect prefers-reduced-motion for the JS-driven parts too (CSS transitions/
// animations are already neutralised globally above) -- number tweening below
// jumps straight to the target value instead of running its own rAF loop.
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// ============================================================== glossary ===
// Single source of truth: both the Significats tab and every inline <span
// class="term"> elsewhere in this page read from GLOSSARY, so a definition is
// never duplicated or allowed to drift between the two places it appears.
const GLOSSARY = {
  'stop-loss': "Preu al qual una posicio es tanca automaticament si el mercat va en contra nostra, per limitar la perdua.",
  'take-profit': "Preu objectiu al qual una posicio guanyadora es tanca automaticament per assegurar el benefici.",
  'rsi': "Relative Strength Index: indicador de 0 a 100 que mesura si un actiu esta sobrecomprat (per sobre de 70) o sobrevenut (per sota de 30).",
  'sma': "Simple Moving Average: mitjana mobil del preu de tancament durant un nombre fix de sessions, suavitza el soroll de curt termini.",
  'spot': "Compra o venda de l'actiu real, sense apalancament ni derivats, amb lliurament immediat.",
  'confidence': "Grau de seguretat que el propi model assigna a la seva decisio, de 0 (gens segur) a 1 (totalment segur).",
  'circuit breaker': "Mecanisme de seguretat que atura les operacions per la resta del dia si la perdua realitzada supera un limit fixat.",
  'hold': "Accio de no fer res: mantenir la posicio actual sense comprar ni vendre.",
  'buy': "Accio de comprar l'actiu.",
  'sell': "Accio de vendre l'actiu.",
  'override': "Quan el gestor de risc modifica o bloqueja la decisio original del model per aplicar una regla de seguretat.",
  'simulacio': "Mode de prova: les operacions es registren pero no es fa cap ordre real ni es mou diner de veritat.",
  'real': "Mode en actiu: les ordres s'executen de veritat contra el broker o l'exchange, amb diner real.",
  'nr': "\"No hi ha registre\": no hi ha prou historial de preu per calcular aquest retorn (per exemple, un actiu que cotitza fa poc).",

function term(word, label) {
  label = label || word;
  // data-term round-trips through el.dataset.term on read, which the browser
  // HTML-decodes automatically -- so the attribute value must be properly
  // entity-escaped here (glossary keys like "p&l realitzat" contain a literal
  // "&") for the write side to match.
  const safeWord = String(word).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  return `<span class="term" data-term="${safeWord}">${label}</span>`;
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);

// ================================================================== CSV  ===
function parseCSV(text) {
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function fmtMoney(n) {
  return isFinite(n) ? '$' + n.toLocaleString('ca-ES', { maximumFractionDigits: 2, minimumFractionDigits: 2 }) : '—';
}
function fmtMoneySigned(n) {
  if (!isFinite(n)) return '—';
  return (n < 0 ? '-' : '+') + '$' + Math.abs(n).toLocaleString('ca-ES', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
}
function fmtPct(n, digits) {
  digits = digits === undefined ? 2 : digits;
  if (n === null || n === undefined || !isFinite(n)) return `<b class="nr mono">${term('nr', 'NR')}</b>`;
  const cls = n > 0 ? 'pos' : n < 0 ? 'neg' : '';
  return `<b class="${cls} mono">${n >= 0 ? '+' : ''}${n.toFixed(digits)}%</b>`;
}

// ======================================================== number tweening ==
// Numbers that update (equity, P&L, holdings) count/tween to their new value
// instead of snapping instantly. State lives here (not in the DOM) because the
// holdings list and table are fully re-rendered from scratch on every refresh,
// not diffed -- keying the "previous value" cache by a stable id sidesteps that.
const _prevValues = Object.create(null);
const NUMBER_FORMATTERS = {
  money: fmtMoney,
  moneySigned: fmtMoneySigned,
  int: v => Math.round(v).toLocaleString('ca-ES'),
};

function tweenNumber(el, key, toValue, formatterKey, duration) {
  if (!el || !isFinite(toValue)) return;
  duration = duration || 520;
  const format = NUMBER_FORMATTERS[formatterKey];
  const from = key in _prevValues ? _prevValues[key] : toValue;
  _prevValues[key] = toValue;

  if (REDUCE_MOTION || from === toValue) {
    el.textContent = format(toValue);
    return;
  }
  const start = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    el.textContent = format(from + (toValue - from) * eased);
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// A generic helper for numbers embedded inside innerHTML-rendered blocks (the
// holdings list): render with data-anim/data-target/data-fmt placeholders, then
// wire them up in one pass right after insertion.
function wireAnimatedNumbers(container) {
  container.querySelectorAll('[data-anim]').forEach(el => {
    const raw = parseFloat(el.dataset.target);
    tweenNumber(el, el.dataset.anim, raw, el.dataset.fmt, el.dataset.dur ? +el.dataset.dur : undefined);
  });
}

// ============================================================ equity curve =
// Monotone cubic interpolation (Fritsch-Carlson) -- smooth through the points
// without the overshoot a plain Catmull-Rom spline would introduce, which
// matters here: an overshoot on a flat equity curve would draw a fake bump.
function monotoneTangents(xs, ys) {
  const n = xs.length;
  const d = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  const m = new Array(n);
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = (d[i - 1] * d[i] <= 0) ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i];
    const s = a * a + b * b;
    if (s > 9) {
      const tau = 3 / Math.sqrt(s);
      m[i] = tau * a * d[i];
      m[i + 1] = tau * b * d[i];
    }
  }
  return m;
}

function monotonePath(xs, ys) {
  const m = monotoneTangents(xs, ys);
  let d = `M ${xs[0].toFixed(2)},${ys[0].toFixed(2)}`;
  for (let i = 0; i < xs.length - 1; i++) {
    const dx = (xs[i + 1] - xs[i]) / 3;
    const c1x = xs[i] + dx, c1y = ys[i] + m[i] * dx;
    const c2x = xs[i + 1] - dx, c2y = ys[i + 1] - m[i + 1] * dx;
    d += ` C ${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${xs[i + 1].toFixed(2)},${ys[i + 1].toFixed(2)}`;
  }
  return d;
}

let curveState = { points: [], xs: [], ys: [], W: 680, H: 160 };
let equityCurveDrawnOnce = false;

function renderEquityCurve(data) {
  const svg = document.getElementById('equityCurve');
  const points = data
    .map(r => ({ t: r.timestamp, v: parseFloat(r.account_equity_usd) }))
    .filter(p => isFinite(p.v));
  if (points.length < 2) { svg.innerHTML = ''; curveState = { points: [], xs: [], ys: [], W: 680, H: 160 }; return; }

  const W = 680, H = 160, PAD_X = 6, PAD_Y = 12;
  const values = points.map(p => p.v);
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const xs = points.map((_, i) => PAD_X + (i / (points.length - 1)) * (W - PAD_X * 2));
  const ys = points.map(p => H - PAD_Y - ((p.v - min) / span) * (H - PAD_Y * 2));

  curveState = { points, xs, ys, W, H };

  const linePath = monotonePath(xs, ys);
  const areaPath = `${linePath} L ${xs[xs.length - 1].toFixed(2)},${H} L ${xs[0].toFixed(2)},${H} Z`;
  const rising = values[values.length - 1] >= values[0];
  const strokeHex = rising ? '#3ddc84' : '#ff5c72';

  svg.innerHTML = `
    <defs><linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${strokeHex}" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="${strokeHex}" stop-opacity="0"/>
    </linearGradient></defs>
    <path class="eq-area" d="${areaPath}" fill="url(#eqFill)" stroke="none"/>
    <path class="eq-line" d="${linePath}" fill="none" stroke="${strokeHex}" stroke-width="2.25" vector-effect="non-scaling-stroke"/>
    <circle class="eq-dot" r="4" fill="${strokeHex}" style="display:none"/>
  `;

  // Draw-in animation only on the very first successful render (page load) --
  // redoing it on every 45s refresh would be motion for motion's sake, not the
  // "sparingly" this pass asks for.
  if (!equityCurveDrawnOnce && !REDUCE_MOTION) {
    const lineEl = svg.querySelector('.eq-line');
    const len = lineEl.getTotalLength();
    lineEl.style.strokeDasharray = String(len);
    lineEl.style.strokeDashoffset = String(len);
    lineEl.getBoundingClientRect(); // force reflow so the transition below applies
    lineEl.style.transition = `stroke-dashoffset ${560}ms var(--ease)`;
    requestAnimationFrame(() => { lineEl.style.strokeDashoffset = '0'; });
  }
  equityCurveDrawnOnce = true;
}

// Hover tooltip: listeners attached once (the <svg> node itself survives every
// re-render, only its children are replaced), reading live state from
// `curveState` so they always reflect the latest data.
(function wireEquityTooltip() {
  const svg = document.getElementById('equityCurve');
  const tooltip = document.getElementById('eqTooltip');

  function handleMove(evt) {
    const { points, xs, ys, W } = curveState;
    if (!points.length) return;
    const dot = svg.querySelector('.eq-dot');
    if (!dot) return;

    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const relX = ((clientX - rect.left) / rect.width) * W;

    let idx = 0, best = Infinity;
    for (let i = 0; i < xs.length; i++) {
      const dist = Math.abs(xs[i] - relX);
      if (dist < best) { best = dist; idx = i; }
    }

    dot.setAttribute('cx', xs[idx]);
    dot.setAttribute('cy', ys[idx]);
    dot.style.display = 'block';

    const p = points[idx];
    const date = new Date(p.t);
    const dateLabel = isNaN(date)
      ? (p.t || '').slice(0, 16).replace('T', ' ')
      : date.toLocaleString('ca-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

    tooltip.innerHTML = `<b class="mono">${fmtMoney(p.v)}</b><span>${dateLabel}</span>`;
    tooltip.style.display = 'block';
    const left = (xs[idx] / W) * rect.width;
    tooltip.style.left = Math.min(Math.max(left, 44), rect.width - 44) + 'px';
  }

  function handleLeave() {
    const dot = svg.querySelector('.eq-dot');
    if (dot) dot.style.display = 'none';
    tooltip.style.display = 'none';
  }

  svg.addEventListener('mousemove', handleMove);
  svg.addEventListener('mouseleave', handleLeave);
  svg.addEventListener('touchmove', handleMove, { passive: true });
  svg.addEventListener('touchend', handleLeave);
})();

const RETURN_WINDOWS = [
  ['return_1w_pct', '1s'], ['return_1m_pct', '1m'], ['return_6m_pct', '6m'],
  ['return_1y_pct', '1a'], ['return_3y_pct', '3a'], ['return_6y_pct', '6a'],

// A tiny inline sparkline from data already on the page (signals.csv logs
// current_price for every symbol on every 4h cycle, since every configured
// symbol is evaluated -- and logged -- whether it holds, buys, or sells). No
// new backend call, no new export.
function sparkline(values, colorVar) {
  if (values.length < 2) return '';
  const w = 56, h = 22, pad = 2;
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const pts = values.map((v, i) => {
    const x = pad + (i / (values.length - 1)) * (w - 2 * pad);
    const y = h - pad - ((v - min) / span) * (h - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${colorVar}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function sanitizeId(symbol) {
  return symbol.replace(/[^A-Za-z0-9]/g, '_');
}

function renderHoldings(positions, priceSeriesBySymbol) {
  const el = document.getElementById('holdings');
  if (!positions || !positions.length) {
    el.innerHTML = `<div class="empty-note">No hi ha cap posicio oberta actualment.</div>`;
    return;
  }

  el.innerHTML = positions.map(p => {
    const id = sanitizeId(p.symbol);
    const invested = p.qty * p.avg_entry_price;
    const hasPnl = p.unrealized_pnl_usd !== null && p.unrealized_pnl_usd !== undefined;
    const currentValue = hasPnl ? invested + p.unrealized_pnl_usd : null;
    const pnlCls = hasPnl ? (p.unrealized_pnl_usd > 0 ? 'pos' : p.unrealized_pnl_usd < 0 ? 'neg' : '') : '';
    const sparkColor = pnlCls === 'pos' ? 'var(--buy)' : pnlCls === 'neg' ? 'var(--sell)' : 'var(--muted)';

    const returns = RETURN_WINDOWS.map(([key, label]) => `
      <div class="r"><span>${label}</span>${fmtPct(p[key], 1)}</div>
    `).join('');

    const valueLine = currentValue !== null
      ? `${fmtMoney(invested)} invertits &rarr; <b class="mono" data-anim="hold:${id}:value" data-target="${currentValue}" data-fmt="money">${fmtMoney(currentValue)}</b> ara`
      : `${fmtMoney(invested)} invertits`;

    const series = (priceSeriesBySymbol[p.symbol] || []);
    const sparkHtml = sparkline(series, sparkColor);

    const pctHtml = (p.unrealized_pnl_pct !== null && p.unrealized_pnl_pct !== undefined)
      ? `<b class="${pnlCls} mono" data-anim="hold:${id}:pct" data-target="${p.unrealized_pnl_pct}" data-fmt="pctSignedInline">${(p.unrealized_pnl_pct >= 0 ? '+' : '') + p.unrealized_pnl_pct.toFixed(2)}%</b>`
      : `<b class="mono">&mdash;</b>`;
    const usdHtml = hasPnl
      ? `<span class="mono" data-anim="hold:${id}:usd" data-target="${p.unrealized_pnl_usd}" data-fmt="moneySigned">${fmtMoneySigned(p.unrealized_pnl_usd)}</span>`
      : '';

    return `
      <div class="holding ${pnlCls}">
        <div>
          <div class="head"><span class="sym">${escapeHtml(p.symbol)}</span><span class="ac">${escapeHtml(p.asset_class)}</span></div>
          <div class="value">${valueLine}</div>
        </div>
        <div class="pnl">
          ${sparkHtml}
          <div class="pnl-figures">
            <span class="pnl-label">${term('p&l no realitzat', 'P&amp;L no realitzat')}</span>
            ${pctHtml}
            ${usdHtml}
          </div>
        </div>
        <div class="returns">${returns}</div>
      </div>
    `;
  }).join('');

  wireAnimatedNumbers(el);
}
NUMBER_FORMATTERS.pctSignedInline = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

// =============================================================== clocks ====
// Only shown for asset classes actually held right now, read fresh from
// positions.json every time it refreshes -- not a fixed set of markets.
function nyseStatus(now) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: 'numeric', minute: 'numeric',
    hour12: false, weekday: 'short',
  }).formatToParts(now).reduce((acc, p) => (acc[p.type] = p.value, acc), {});
  const minutes = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
  const isWeekday = !['Sat', 'Sun'].includes(parts.weekday);
  // 9:30-16:00 ET. Holidays are not modeled -- an acceptable gap for a clock widget.
  const open = isWeekday && minutes >= 9 * 60 + 30 && minutes < 16 * 60;
  const label = new Intl.DateTimeFormat('ca-ES', {
    timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(now);
  return { open, label };
}

function renderClocks(positions) {
  const el = document.getElementById('clocks');
  const hasCrypto = (positions || []).some(p => p.asset_class === 'crypto');
  const hasEquity = (positions || []).some(p => p.asset_class === 'equity');
  const now = new Date();
  const chips = [];

  if (hasCrypto) {
    const utc = new Intl.DateTimeFormat('ca-ES', { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
    chips.push(`<div class="clock"><svg class="icon"><use href="#i-clock"/></svg><span class="dot open"></span><span class="label">${term('spot', 'Cripto')}</span><b class="mono">${utc} UTC</b></div>`);
  }
  if (hasEquity) {
    const nyse = nyseStatus(now);
    chips.push(`<div class="clock"><svg class="icon"><use href="#i-clock"/></svg><span class="dot ${nyse.open ? 'open' : 'closed'}"></span><span class="label">NYSE</span><b class="mono">${nyse.label}</b></div>`);
  }
  el.innerHTML = chips.join('');
}

// ============================================================= countdown ===
// Same cron this dashboard's cycle actually runs on: every 4h, on the hour
// (see .github/workflows/trading_bot.yml). Purely a presentation layer over
// that fixed schedule -- it does not trigger anything itself. The ring's sweep
// is a CSS transition on --pct (registered via @property above so browsers
// that support it animate the conic-gradient smoothly); this is a live,
// once-a-second clock, not decorative motion, so it is not gated on
// prefers-reduced-motion -- only its cosmetic sweep easing is (via the global
// transition-duration override).
const CYCLE_HOURS = 4;
function updateCountdown() {
  const now = new Date();
  const next = new Date(now);
  next.setUTCMinutes(0, 0, 0);
  next.setUTCHours(Math.ceil((now.getUTCHours() + 0.0001) / CYCLE_HOURS) * CYCLE_HOURS);

  const totalMs = CYCLE_HOURS * 3600 * 1000;
  const remainingMs = next - now;
  const elapsedPct = 100 - (remainingMs / totalMs) * 100;

  const h = Math.floor(remainingMs / 3600000);
  const m = Math.floor((remainingMs % 3600000) / 60000);
  const s = Math.floor((remainingMs % 60000) / 1000);
  document.getElementById('countdownTime').textContent =
    `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  document.querySelector('#countdown .ring').style.setProperty('--pct', elapsedPct.toFixed(1));
}
setInterval(updateCountdown, 1000);
updateCountdown();

const ACTION_ICON = { buy: 'i-up', sell: 'i-down', hold: 'i-minus' };

function confidenceBand(c) {
  if (!isFinite(c)) return null;
  if (c >= 0.7) return 'high';
  if (c >= 0.4) return 'mid';
  return 'low';
}

function overrideKind(overrideReason) {
  if (!overrideReason) return null;
  const lower = overrideReason.toLowerCase();
  // glossaryTerm is null for an auto-close: "automatic exit" isn't a glossary
  // entry in its own right (it's just a stop-loss/take-profit firing), so the
  // bolt icon plus the raw reason text is the whole story there.
  if (lower.includes('automatic exit')) return { icon: 'i-bolt', iconFill: true, cls: 'auto', glossaryTerm: null };
  if (lower.includes('circuit breaker')) return { icon: 'i-shield', cls: 'breaker', glossaryTerm: 'circuit breaker' };
  return { icon: 'i-shield', cls: 'override', glossaryTerm: 'override' };
}

      : '';
    const positioningHtml = r.market_positioning
      ? `<div class="positioning"><div class="sub-label"><svg class="icon"><use href="#i-wallet"/></svg>Posicionament</div>${escapeHtml(r.market_positioning)}</div>`
      : '';
    const modeChip = r.mode
      ? `<span class="mode-chip ${r.mode}">${term(r.mode.toLowerCase(), r.mode)}</span>`
      : '';

    const kind = overrideKind(r.override_reason);
    const overrideLabel = kind && kind.glossaryTerm
      ? term(kind.glossaryTerm, capitalize(kind.glossaryTerm)) + ': '
      : '';
    const overrideHtml = r.override_reason
      ? `<div class="override-note ${kind ? kind.cls : ''}">${kind ? `<svg class="icon${kind.iconFill ? ' icon-fill' : ''}"><use href="#${kind.icon}"/></svg>` : ''}<span>${overrideLabel}${escapeHtml(r.override_reason)}</span></div>`
      : '';

    const action = (r.action || '').toLowerCase();
    const actionIcon = ACTION_ICON[action];
    const actionHtml = action
      ? `<span class="action-cell ${action}">${actionIcon ? `<svg class="icon"><use href="#${actionIcon}"/></svg>` : ''}${term(action, escapeHtml(action))}</span>`
      : '';

    const conf = r.confidence ? +r.confidence : NaN;
    const band = confidenceBand(conf);
    const confHtml = isFinite(conf)
      ? `${band ? `<span class="conf-dot ${band}"></span>` : ''}<span class="mono">${conf.toFixed(2)}</span>`
      : '';

    return `
    <tr>
      <td class="mono">${(r.timestamp || '').slice(0, 16).replace('T', ' ')}</td>
      <td>${escapeHtml(r.symbol || '')}</td>
      <td>${modeChip}</td>
      <td>${actionHtml}</td>
      <td class="mono" style="color:var(--muted)">${escapeHtml(r.raw_action || '')}</td>
      <td>${confHtml}</td>
      <td class="mono">${r.position_size_pct ? (+r.position_size_pct).toFixed(2) : ''}</td>
      <td class="mono">${r.current_price ? (+r.current_price).toFixed(2) : ''}</td>
      <td>${escapeHtml(r.execution_status || '')}</td>
      <td class="mono">${r.realized_pnl_usd ? (+r.realized_pnl_usd).toFixed(2) : ''}</td>
      <td class="reason">${overrideHtml}${escapeHtml(r.reasoning || '')}${headlinesHtml}${positioningHtml}</td>
    </tr>`;
  }).join('');
}

function renderResum(data, positionsPayload) {
  const newest = data[data.length - 1];
  const eq = parseFloat(newest.account_equity_usd);
  tweenNumber(document.getElementById('equity'), 'equity', eq, 'money');
  tweenNumber(document.getElementById('count'), 'count', data.length, 'int');

  const pnl = data.reduce((s, r) => s + (parseFloat(r.realized_pnl_usd) || 0), 0);
  const pnlEl = document.getElementById('pnl');
  tweenNumber(pnlEl, 'pnl', pnl, 'moneySigned');
  pnlEl.className = 'mono ' + (pnl > 0 ? 'pos' : pnl < 0 ? 'neg' : '');

  renderEquityCurve(data);

  const isLive = positionsPayload ? !!positionsPayload.is_live : false;
  const badge = document.getElementById('modeBadge');
  badge.innerHTML = '<span class="dot"></span>' + (isLive ? term('real', 'REAL') : term('simulacio', 'SIMULACIO'));
  badge.className = 'mode-badge ' + (isLive ? 'live' : 'sim');

  const positions = positionsPayload ? positionsPayload.positions : [];

  // Per-symbol price history for the holdings sparklines, built from data
  // already on the page (see the sparkline() comment) -- no extra fetch.
  const priceSeriesBySymbol = {};
  for (const p of positions) {
    priceSeriesBySymbol[p.symbol] = data
      .filter(r => r.symbol === p.symbol)
      .map(r => parseFloat(r.current_price))
      .filter(v => isFinite(v));
  }

  renderHoldings(positions, priceSeriesBySymbol);
  renderClocks(positions);
}

// Plain data refresh, NOT a re-run of the 4h AI trading cycle. signals.csv and
// positions.json are static files this pipeline exports on its own schedule
// (the cycle itself every 4h, positions.json also independently every 15 min
// via refresh_positions.yml); this just re-reads whatever is currently on
// disk, cheaply, so the numbers feel live between real cycles.
const REFRESH_MS = 45000;
document.getElementById('refreshSecs').textContent = Math.round(REFRESH_MS / 1000);

async function loadAll() {
  const bust = '?t=' + Date.now();
  const [csvText, positionsPayload] = await Promise.all([
    fetch('signals.csv' + bust).then(r => r.text()),
    fetch('positions.json' + bust).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);

  const raw = parseCSV(csvText.trim());
  if (raw.length < 2) return;
  const head = raw[0];
  const data = raw.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));

  renderResum(data, positionsPayload);
  renderAnalisi(data);
}

renderGlossaryTab();
wireGlossarySearch();
moveTabIndicator(document.querySelector('nav.tabs button.active'));
loadAll().catch(e => {
  document.getElementById('rows').innerHTML =
    '<tr><td colspan="11">No s\'ha pogut carregar signals.csv: ' + escapeHtml(String(e)) + '</td></tr>';
});
setInterval(() => loadAll().catch(() => {}), REFRESH_MS);
</script>
